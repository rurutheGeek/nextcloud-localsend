name: Release

# Builds the app archive for a published GitHub release.
#
# Without signing set up (the default) the workflow attaches an unsigned
# archive, which is enough for manual installs. Once the certificate has been
# registered in the Nextcloud App Store:
#   - set the repository secrets APP_PRIVATE_KEY and APP_PUBLIC_CRT
#   - set the repository variable SIGNING_ENABLED=true (krankerl signs the archive)
#   - set the repository secrets APPSTORE_TOKEN and the variable
#     APPSTORE_ENABLED=true to push the release to the App Store
#
# The certificate is obtained once via a pull request to
# https://github.com/nextcloud/app-certificate-requests (see README).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: localsend_share

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches appinfo/info.xml
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').findtext('version'))")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match appinfo/info.xml version $version"
            exit 1
          fi

      - name: Build the app bundle
        run: npm ci && npm run build

      - name: Build the release archive
        run: |
          mkdir -p build/artifacts
          tar \
            --exclude='./node_modules' \
            --exclude='./server' \
            --exclude='./.github' \
            --exclude='./krankerl.toml' \
            --exclude='./.gitignore' \
            --exclude='./.nextcloudignore' \
            --exclude='./.git' \
            --transform "s,^\.,${APP_ID}," \
            -czf "build/artifacts/${APP_ID}.tar.gz" .
          tar tzf "build/artifacts/${APP_ID}.tar.gz" | head -1

      - name: Sign the archive
        if: vars.SIGNING_ENABLED == 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          cargo install --git https://github.com/ChristophWurst/krankerl --locked
          mkdir -p ~/.nextcloud/certificates
          printf '%s' "$APP_PRIVATE_KEY" > ~/.nextcloud/certificates/$APP_ID.key
          printf '%s' "$APP_PUBLIC_CRT" > ~/.nextcloud/certificates/$APP_ID.crt
          krankerl package
          krankerl sign --package
          rm -f ~/.nextcloud/certificates/*

      - name: Attach the archive to the GitHub release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        id: attach
        with:
          file: build/artifacts/localsend_share.tar.gz
          asset_name: localsend_share.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: Publish to the Nextcloud App Store
        if: github.event_name == 'release' && vars.APPSTORE_ENABLED == 'true'
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          krankerl login --appstore "$APPSTORE_TOKEN"
          krankerl publish "${{ steps.attach.outputs.browser_download_url }}"

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend_share.tar.gz
          path: build/artifacts/localsend_share.tar.gz
